services:
  mongo:
    image: mongo:8.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1})']
      interval: 5s
      timeout: 5s
      retries: 30
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ['mongosh', '--host', 'mongo:27017', '--quiet', '--eval']
    command:
      - 'try { rs.status() } catch (e) { if (e.codeName === "NotYetInitialized") { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) } else { throw e } }'
  redis:
    image: redis:8-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_IGNORE_DUPLICATE_IDS: 'true'
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '0'
      MP_DISABLE_VERSION_CHECK: 'true'
    volumes: ['mailpit-data:/data']
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  mailpit-data:
  mongo-data:
  redis-data:

name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: docker compose up -d --wait mongo redis mailpit
      - run: docker compose up mongo-init
      - name: Database, run API, and worker recovery integration
        run: pnpm exec vitest run --maxWorkers=2 apps/api/src/database.integration.test.ts apps/api/src/runs.integration.test.ts apps/api/src/reliability.integration.test.ts apps/api/src/approvals.integration.test.ts apps/api/src/support.integration.test.ts apps/api/src/chaos.integration.test.ts apps/api/src/policies.integration.test.ts apps/api/src/moderation.integration.test.ts apps/api/src/time-travel.integration.test.ts apps/api/src/demo-seed.integration.test.ts apps/api/src/operations.integration.test.ts apps/api/src/whatsapp.integration.test.ts apps/api/src/notifications.integration.test.ts apps/worker/src/recovery.integration.test.ts apps/worker/src/saga.integration.test.ts
        env:
          INTEGRATION_MONGODB_URI: mongodb://127.0.0.1:27017/unkillable_ci?replicaSet=rs0&directConnection=true
          INTEGRATION_REDIS_URL: redis://127.0.0.1:6379
          INTEGRATION_MAILPIT_URL: http://127.0.0.1:8025
          SUPPORT_LLM_PROVIDER: mock
      - run: pnpm build
      - name: Seeded chaos invariants (50 support runs)
        run: pnpm chaos --runs 50 --seed 20261116 --report-dir docs/chaos-ci
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/unkillable_ci?replicaSet=rs0&directConnection=true
          REDIS_URL: redis://127.0.0.1:6379
          MAILPIT_API_URL: http://127.0.0.1:8025
      - name: Preserve measured chaos report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-ci-report
          path: docs/chaos-ci/CHAOS-REPORT.*
          if-no-files-found: warn
      - run: pnpm exec playwright install --with-deps chromium
      - name: Release demo and browser regression
        run: pnpm test:e2e
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/unkillable_ci?replicaSet=rs0&directConnection=true
          REDIS_URL: redis://127.0.0.1:6379
      - if: always()
        run: docker compose down

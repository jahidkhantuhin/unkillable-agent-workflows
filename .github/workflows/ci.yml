name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: docker compose up -d --wait mongo redis mailpit
      - run: docker compose up mongo-init
      - name: MongoDB auth and index integration
        run: pnpm exec vitest run apps/api/src/database.integration.test.ts
        env:
          INTEGRATION_MONGODB_URI: mongodb://127.0.0.1:27017/unkillable_ci?replicaSet=rs0&directConnection=true
      - if: always()
        run: docker compose down
      - run: pnpm build
